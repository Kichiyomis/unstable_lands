# Тест: появляются ли вообще новые workflow в Actions.
# Запуск: вкладка Actions → "Test Actions" → Run workflow → Run workflow.
# Если этот run появится и выполнится — проблема в триггере push у nuxtjs.yml или в GitHub.
name: Test Actions

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: OK
        run: echo "Workflow works - Actions are running."
